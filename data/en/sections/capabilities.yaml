# section information
section:
  name: Core Expertise
  id: capabilities
  enable: true
  weight: 3
  showOnNavbar: true
  template: sections/capabilities.html

background:
  color: "#111827"

skills:
- name: Legacy Modernization
  icon: "fas fa-layer-group"
  summary: >
    I modernize inherited applications by recovering undocumented business rules, upgrading frameworks and runtime environments, and restructuring code to support continued development and production use.

- name: Integration Architecture
  icon: "fas fa-diagram-project"
  summary: >
    I separate business logic from data access and define integration boundaries that accommodate changing data sources. My work includes event-driven integrations, data synchronization, and API contracts.

- name: Domain Clarity
  icon: "fas fa-sitemap"
  summary: >
    I turn business rules into explicit domain models and responsibilities, covering insurance workflows, configurable pricing, and collaborative processes across departments.

- name: Technical Leadership
  icon: "fas fa-gears"
  summary: >
    I combine hands-on engineering with people leadership, mentoring, recruitment, and employee evaluation. I establish work intake, sprint planning, and release practices in collaboration with business stakeholders.

- name: Business-to-Technology Translation
  icon: "fas fa-compass"
  summary: >
    I work with stakeholders to shape product workflows and translate business needs into application architecture and working software, from loyalty platforms and product operations to Bikeparks.pl.

- name: AI-Native Engineering
  icon: "fas fa-microchip"
  summary: >
    I define specifications and architectural boundaries for AI coding agents, review their implementation, and retain final authority over merges and releases. Automated quality gates support this workflow.
