name: PR Workflows

# Run action on pull request event
on: [pull_request]

jobs:
  # Build the site on every pull request.
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the commit from the pull request.
      - uses: actions/checkout@v4.1.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.3.0
        with:
          hugo-version: '0.170.0'
          dart-sass-version: '1.108.2'

      - name: Install node modules
        run: npm ci

      - name: Build
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
